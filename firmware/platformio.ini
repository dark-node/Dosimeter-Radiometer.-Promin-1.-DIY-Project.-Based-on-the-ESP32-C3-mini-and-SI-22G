; SI22G Dosimeter — ESP32-C3 Super Mini (PlatformIO / Arduino reference)
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

build_flags =
    -D PIN_OLED_SDA=4
    -D PIN_OLED_SCL=5
    -D PIN_LED=6
    -D PIN_PIEZO_CENTER=7
    -D PIN_PIEZO_RING=10
    -D PIN_BAT_ADC=3
    -D OLED_WIDTH=128
    -D OLED_HEIGHT=32

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.12.1
    adafruit/Adafruit BusIO @ ^1.17.2
